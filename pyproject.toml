[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tonnetzkit"
version = "1.0.0"
description = "Teaching toolkit for Euler's Tonnetz, neo-Riemannian graphs and chord complexes"
authors = [{name = "Hale Tureli"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = ["numpy", "networkx", "matplotlib", "pandas"]

[project.optional-dependencies]
audio = ["librosa>=0.10"]
corpora = ["music21>=9"]
book = ["jupyter-book<2", "ipykernel", "librosa>=0.10", "music21>=9"]
dev = ["pytest"]

[tool.setuptools]
packages = ["tonnetzkit"]
